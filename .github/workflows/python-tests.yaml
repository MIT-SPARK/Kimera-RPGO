name: Kimera-RPGO Python Tests

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ROS_LOG_DIR: ${{ github.workspace }}/log/ros
    steps:
      - uses: actions/checkout@v6
        with:
          path: src/kimera_rpgo
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ccache nlohmann-json3-dev \
            pybind11-dev python3-dev python3-pytest \
            python3-colcon-common-extensions ros-jazzy-gtsam

      - name: Build library and Python bindings
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p "$ROS_LOG_DIR"
          colcon build --packages-up-to kimera_rpgo --symlink-install \
            --event-handlers console_direct+ \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_TESTING=OFF \
              -DKIMERA_RPGO_BUILD_PYTHON_BINDINGS=ON

      - name: Run pytest
        run: |
          source install/setup.bash
          mkdir -p "$ROS_LOG_DIR"
          export PYTHONPATH="$PWD/build/kimera_rpgo/python${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m pytest -v src/kimera_rpgo/python/tests
